kind: Build
name: gossip
type: container

# Gossip service is not needed in the registry environment
disabled: ${var.envType == "registry" || var.envType == "standalone"}

source:
  path: ../..  # Set build context to repository root

include:
  - lib/gossip/**/*
  - lib/kels/**/*
  - lib/exchange/**/*
  - lib/derive/**/*
  - lib/policy/**/*
  - services/gossip/**/*
  - project.garden.yml
  - .kels/federation-iel.json

spec:
  dockerfile: services/gossip/Dockerfile
  buildArgs:
    # FEDERATION_IEL_PREFIX is compiled into the gossip binary at build
    # (#190 / #194). Runtime override via the same env var; mismatch logs
    # a startup warning. See `docs/design/infrastructure/federation.md
    # §Configuration`. The placeholder value is the all-A digest used
    # before a real federation IEL is incepted; #195 / #196 introduce
    # tooling to populate `.kels/federation-iel.json` from a live
    # federation ceremony.
    FEDERATION_IEL_PREFIX: ${var.federationIelPrefix}

---

kind: Deploy
name: gossip
type: kubernetes

# Gossip service is not needed in the registry environment
disabled: ${var.envType == "registry" || var.envType == "standalone"}

dependencies:
  - build.gossip
  - deploy.kels
  - deploy.redis
  - deploy.identity
  - deploy.sadstore
  - deploy.mail

variables:
  gossipDatabaseUrl: ${var.postgres.url}/kels_gossip
  gossipAdvertiseAddress: "gossip.${environment.name}.kels:${var.gossip.port}"

spec:
  manifestTemplates:
    - manifests.yml.tpl

---

kind: Run
name: fetch-gossip-identity
type: exec

disabled: ${var.envType == "registry" || var.envType == "standalone"}

dependencies:
  - deploy.gossip

spec:
  command:
    - bash
    - ../../scripts/fetch-gossip-identity.sh
    - ${environment.namespace}
